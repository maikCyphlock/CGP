# Solo Windows (lo activa levantar-docker.ps1 con COMPOSE_FILE en .env).
# Compartir carpetas de Windows con la VM de Docker es lento: vendor/ (miles de archivos
# que PHP lee en cada petición) va en un volumen de Docker, no en la carpeta del proyecto.
services:
  app:
    volumes:
      - vendor:/var/www/html/vendor
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    # Cada arranque (también "docker compose start") aplica las migraciones pendientes; reintenta hasta que la base responda.
    command: ["sh", "-c", "until php artisan migrate --force; do echo 'Esperando la base de datos...'; sleep 3; done; exec php artisan serve --host=0.0.0.0 --port=8000 --no-reload"]

volumes:
  vendor:
